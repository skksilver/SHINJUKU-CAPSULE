<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shinjuku Capsule Hotel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #111111, #292929);
      font-family: Arial, Helvetica, sans-serif;
    }

    .welcome {
      text-align: center;
      animation: fadeIn 2s ease-out forwards;
    }

    .welcome h1 {
      color: white;
      font-size: clamp(40px, 7vw, 90px);
      font-weight: 900;
      letter-spacing: 3px;

      animation: slideUp 1.5s ease-out forwards;
    }

    .welcome p {
      margin-top: 20px;
      color: #dddddd;
      font-size: clamp(18px, 2vw, 28px);
      letter-spacing: 5px;

      opacity: 0;
      animation: fadeInText 2s ease-out 0.8s forwards;
    }

    /* Main animation */
    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInText {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- Intro Video -->
<div id="intro">
  <video id="introVideo" autoplay muted playsinline>
    <source src="intro.mp4" type="video/mp4">
  </video>
</div>

<!-- Your Website -->
<div id="main-content">
  <!-- Put your existing website here -->
</div>

<style>
  #intro {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #intro video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #main-content {
    display: none;
  }

  #intro.fade-out {
    animation: fadeOut 1s ease forwards;
  }

  @keyframes fadeOut {
    from {
      opacity: 1;
    }
    to {
      opacity: 0;
    }
  }
</style>

<script>
  const intro = document.getElementById("intro");
  const video = document.getElementById("introVideo");
  const main = document.getElementById("main-content");

  video.addEventListener("ended", () => {
    intro.classList.add("fade-out");

    setTimeout(() => {
      intro.style.display = "none";
      main.style.display = "block";
    }, 1000);
  });
</script>

  <div class="welcome">
    <h1>WELCOME</h1>
    <p>TO SHINJUKU CAPSULE HOTEL</p>
  </div>
