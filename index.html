<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shinjuku Capsule Hotel</title>

  <style>

    /* =========================
       BASIC PAGE
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }


    /* =========================
       INTRO VIDEO
    ========================= */

    #intro {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 9999;
    }

    #intro video {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* =========================
       VIDEO END ANIMATION
    ========================= */

    #intro.zoom-out {
      animation: zoomOut 1.5s ease-in-out forwards;
    }

    @keyframes zoomOut {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.15);
      }

    }


    /* =========================
       BLANK WEBSITE AREA
    ========================= */

    #main-content {

      width: 100%;
      height: 100vh;

      background: white;

      display: none;

    }

  </style>

</head>


<body>


  <!-- =========================
       INTRO VIDEO
  ========================= -->

  <div id="intro">

    <video
      id="introVideo"
      autoplay
      muted
      playsinline
    >

      <source
        src="intro.mp4"
        type="video/mp4"
      >

    </video>

  </div>


  <!-- =========================
       BLANK WEBSITE
       
       WE WILL BUILD EVERYTHING HERE
       ========================= -->

  <div id="main-content">

    <!--
    
    YOUR NEW WEBSITE WILL GO HERE.
    
    IT IS CURRENTLY BLANK.
    
    -->

  </div>


  <!-- =========================
       INTRO SCRIPT
  ========================= -->

  <script>

    const intro = document.getElementById("intro");

    const video = document.getElementById("introVideo");

    const main = document.getElementById("main-content");


    video.addEventListener("ended", function () {

      /* Start zoom animation */

      intro.classList.add("zoom-out");


      /* Wait for animation to finish */

      setTimeout(function () {

        /* Remove video completely */

        intro.style.display = "none";


        /* Show blank website */

        main.style.display = "block";

      }, 1500);

    });

  </script>

</body>

</html>
